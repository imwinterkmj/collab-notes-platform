spring:
  application:
    name: collab-notes-platform
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/${DB_NAME:collab_notes}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:collab_notes}
    password: ${DB_PASSWORD:}
    hikari:
      connection-timeout: 3000
      validation-timeout: 1000

app:
  reminders:
    scheduler-enabled: ${REMINDER_SCHEDULER_ENABLED:true}
    poll-delay-ms: ${REMINDER_POLL_DELAY_MS:5000}
    batch-size: ${REMINDER_BATCH_SIZE:100}
  security:
    password-hash:
      # 内存单位为 KiB：19456 KiB = 19 MiB；降低安全基线会使应用启动失败。
      memory-kib: ${PASSWORD_HASH_MEMORY_KIB:19456}
      iterations: ${PASSWORD_HASH_ITERATIONS:2}

# 这些框架日志可能含校验失败的原文或绑定的 SQL 参数，不能用于凭据/备忘录调试。
logging:
  level:
    org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver: WARN
    org.springframework.jdbc.core.JdbcTemplate: INFO
    org.springframework.jdbc.core.StatementCreatorUtils: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        # 本地 localhost 使用 HTTP；正式部署必须使用 HTTPS 并设为 true。
        secure: ${SESSION_COOKIE_SECURE:false}
